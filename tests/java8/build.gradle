configure(project.subprojects) { subproject ->

    if (JavaVersion.current() != JavaVersion.VERSION_1_8) {
        project.tasks.all { task -> task.enabled = false }
    }

    dependencies {
        testImplementation("junit:junit:${junitVersion}") {
            exclude group: 'org.hamcrest', module: 'hamcrest-core'
        }
        testImplementation("org.hamcrest:hamcrest-core:${hamcrestVersion}")
        testImplementation("org.assertj:assertj-core:${assertjVersion}")

        testImplementation files(project(":tests:mockito:junit4").sourceSets.test.output)
    }

    compileJava {
        sourceCompatibility = 1.8
        targetCompatibility = 1.8
    }

    compileTestJava {
        sourceCompatibility = 1.8
        targetCompatibility = 1.8
    }
}

project(":tests:java8:mockito-junit4") {
    description = "Tests for Mockito module with JUnit 4.x. and Java8."

    dependencies {
        testImplementation project(":powermock-modules:powermock-module-junit4")

        testImplementation project(":powermock-api:powermock-api-mockito2")
        testImplementation ("org.mockito:mockito-core:${mockitoVersion}"){
            exclude group: 'net.bytebuddy', module: 'byte-buddy'
            exclude group: 'net.bytebuddy', module: 'byte-buddy-agent'
        }
    }
}

