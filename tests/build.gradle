def subprojects = project(":tests").subprojects  - project(":tests:easymock")

jar{
    enabled = false
}

configure(subprojects) { project ->
    apply from: "${gradleScriptDir}/java-module.gradle"
}

project(":tests:utils"){
    description = "Common set of classes to test PowerMock features in mocking framework modules."

    dependencies {
        api(project(":powermock-core"))
        api("javax.servlet:servlet-api:${servletVersion}")
    }
}

project(":tests:junit4"){
    description = "Tests for junit4."

    dependencies {
        api(project(":powermock-core"))
        testImplementation(project(":powermock-modules:powermock-module-junit4"))
        testImplementation("junit:junit:${junitVersion}"){
            exclude group:'org.hamcrest', module:'hamcrest-core'
        }
        testImplementation("org.hamcrest:hamcrest-core:${hamcrestVersion}")
        testImplementation("org.easymock:easymock:${easymockVersion}")
        testImplementation("org.assertj:assertj-core:${assertjVersion}")
        testImplementation("com.github.stefanbirkner:system-rules:${systemRulesVersion}")
    }
}

project(":tests:testng") {
    description = "Tests for testng module."

    dependencies {
        api(project(":powermock-core"))
        testImplementation(project(":powermock-modules:powermock-module-testng"))
        testImplementation("org.testng:testng:${testngVersion}")
        testImplementation("org.hamcrest:hamcrest-core:${hamcrestVersion}")
        testImplementation("org.assertj:assertj-core:${assertjVersion}")
    }

    test {
        useTestNG() {
            suites 'suite.xml'
        }
    }
}