project(":tests:mockito:junit4-delegate") {
    description = "Tests for PowerMock JUnit4 runner-delegate and Mockito."

    dependencies {
        testImplementation project(":powermock-modules:powermock-module-junit4")

        testImplementation("junit:junit:${junitVersion}"){
            exclude group:'org.hamcrest', module:'hamcrest-core'
        }

        testImplementation("pl.pragmatists:JUnitParams:1.0.5")

        testImplementation files(project(":tests:mockito:junit4").sourceSets.test.output)
    }

    test{
        scanForTestClasses = false
        include(["**/*Tests.class", "**/*Test.class"])
        // Since we set scanForTestClasses to false, we need to filter out inner
        // classes with the "$" pattern; otherwise, using -Dtest.single=MyTests to
        // run MyTests by itself will fail if MyTests contains any inner classes.
        exclude(["**/Abstract*.class", '**/*$*'])
    }
}

project(":tests:mockito:testng"){
    description = "Tests for Mockito module with TestNG."

    dependencies {
        testImplementation(project(":powermock-core"))
        testImplementation(project(":powermock-modules:powermock-module-testng"))

        testImplementation("org.testng:testng:${testngVersion}")

        testImplementation files(project(":tests:mockito:junit4").sourceSets.test.output)
    }

    test{
        useTestNG(){
            suites 'suite.xml'
            environment "mockitoVersion", "${mockitoVersion}"
        }
    }
}
